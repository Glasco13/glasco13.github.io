<title>Accès protégé</title>
<style>
:root{--bg:#f7f7fb;--surface:#fff;--text:#161827;--muted:#5b6078;--accent:#4f46e5;--border:#dfe2ee}
@media (prefers-color-scheme: dark){:root{--bg:#0d0f1a;--surface:#151829;--text:#e8eaf6;--muted:#9aa0bd;--accent:#818cf8;--border:#272c46}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 8px 30px rgba(20,20,60,.1)}
h1{font-size:1.3rem;margin:0 0 6px}
p{color:var(--muted);font-size:.92rem;margin:0 0 18px}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-size:1rem}
button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:#dc2626;font-size:.88rem;min-height:1.3em;margin-top:10px}
</style>
</head>
<body>

</form>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function enc64(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)));}
function store(k,v){try{v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v);}catch(e){}}
function read(k){try{return sessionStorage.getItem(k);}catch(e){return null;}}
var form=document.getElementById("f");
function showForm(){form.style.display="";document.getElementById("pw").focus();}
async function openPage(key){
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(DATA));
  var html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
}
// Clé déjà calculée dans cet onglet : déchiffrement instantané, sans formulaire
async function fromStoredKey(){
  var k=read("cvkey");
  if(!k||read("cvsalt")!==SALT)return false;
  try{await openPage(await crypto.subtle.importKey("raw",b64(k),"AES-GCM",false,["decrypt"]));return true;}
  catch(e){store("cvkey",null);return false;}
}
async function fromPassword(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  var raw=await crypto.subtle.exportKey("raw",key);
  await openPage(key);
  store("cvkey",enc64(raw));store("cvsalt",SALT);
}
async function tryPw(pw){
  var b=document.getElementById("b"),e=document.getElementById("err");
  b.disabled=true;b.textContent="Vérification…";e.textContent="";
  try{await fromPassword(pw);}
  catch(x){showForm();b.disabled=false;b.textContent="Déverrouiller";e.textContent="Mot de passe incorrect.";}
}
form.addEventListener("submit",function(ev){ev.preventDefault();tryPw(document.getElementById("pw").value);});
// On attend la fin du chargement de cette page avant de la remplacer
// (sinon le navigateur ignore le remplacement quand le déchiffrement est trop rapide)
async function start(){
  if(location.hash.length>1){var h=decodeURIComponent(location.hash.slice(1));history.replaceState(null,"",location.pathname);await tryPw(h);return;}
  if(!(await fromStoredKey()))showForm();
}
if(document.readyState==="complete")setTimeout(start,0);
else addEventListener("load",function(){setTimeout(start,0);});
</script>
